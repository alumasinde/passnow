name: Go CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Report formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following Go files need gofmt:"
            echo "$files"
          else
            echo "All Go files are gofmt-clean."
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
