name: Go Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gatepass_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true

      - name: Verify dependencies
        run: go mod tidy

      - name: Test environment
        shell: bash
        run: echo "PASSNOW_TEST_DSN=root:root@tcp(127.0.0.1:3306)/gatepass_test?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci&loc=UTC" >> "$GITHUB_ENV"

      - name: Install migration tool dependencies
        run: go run ./cmd/migrate -help

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
