name: CI

on:
  push:
    branches: [main, phase6b-production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Go backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...

  frontend:
    name: PHP frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find frontend -type f -name '*.php' -print0)
